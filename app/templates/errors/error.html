{# Any other HTTP error (405, 413, 429, ...): a heading and a sentence chosen in create_app(). #}
{% extends "base.html" %}

{% block title %}{{ heading }} · SpendSense{% endblock %}

{% block content %}
  <section class="notice">
    <h1>{{ heading }}</h1>
    <p>{{ message }}</p>
    <p><a href="{{ url_for('public.index') }}">Back to the home page</a></p>
  </section>
{% endblock %}
